#docker compose up --build -d
#docker compose down -v

version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: chat-postgres
    environment:
      POSTGRES_DB: chatdb
      POSTGRES_USER: chatuser
      POSTGRES_PASSWORD: chatpass
    ports:
      - "7777:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatuser -d chatdb"]
      interval: 5s
      timeout: 5s
      retries: 5
  chat-app:
    build: .
    container_name: chat-signalr
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=chatdb;Username=chatuser;Password=chatpass;Gss Encryption Mode=Disable
    depends_on:
      postgres:
        condition: service_healthy  
    restart: unless-stopped
    volumes:
      - dp_keys:/root/.aspnet/DataProtection-Keys
volumes:
  postgres_data:
  dp_keys: